name: Update ports

on:
  schedule:
    # Monthly, 1st day of the month at 06:00 UTC
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch IANA registry and regenerate JSON
        run: node scripts/build.js

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data api/v1
          if git diff --cached --quiet; then
            echo "No changes to the port data."
          else
            git commit -m "Update port records from IANA registry" --no-verify
            git push
          fi
